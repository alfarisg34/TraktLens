<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a33"/>
      <stop offset="100%" stop-color="#db0f17"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ed1c24" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer glowing rounded squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  
  <!-- Bold modern stylized "T" -->
  <path d="M34 35 H94 V53 H73 V96 H55 V53 H34 Z" fill="#ffffff" />
  
